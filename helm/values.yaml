crossplane:
  namespace: crossplane-system
  # Name of the Crossplane ProviderConfig that holds the DHCP API connection details.
  # Override this if you have multiple provider configs (e.g. per-site or per-environment).
  providerConfigName: dhcp-http

# Where the DHCP API lives. A platform-wide constant, not per-cluster config, so it
# stays here in the chart rather than in the GitOps values repo — every hosted cluster
# in a given cluster talks to the same API.
#
# In-cluster Service address on purpose: Crossplane provider-http runs in the same
# cluster, so a Route would add a public hop and TLS for no benefit.
dhcp_api:
  url: http://dhcp-scope-manager.dhcp-scope-manager.svc.cluster.local:8080

  # Bearer token for the API. OPTIONAL — the API disables auth entirely when its own
  # DHCP_API_TOKEN is unset, and an empty ref here renders no Authorization header.
  #
  # When set, all three keys are required and provider-http resolves them from the
  # live Secret at reconcile time, keeping the token out of git and out of the Argo
  # CD UI (see the Authorization header in templates/dhcp-scope-request.yaml).
  tokenSecretRef: {}
  #   name: dhcp-api-token
  #   namespace: crossplane-system
  #   key: token

# dhcp_values comes from the GitOps values hierarchy, NOT from here:
#
#   sites/configValues.yaml
#     -> sites/<site>/values.yaml
#       -> sites/<site>/mces/<mce>/values.yaml
#         -> sites/<site>/mces/<mce>/hostedClusters/<cluster>.yaml
#
# This file is the base of that merge, so anything set here is inherited by EVERY
# hosted cluster and cannot be unset by a site or cluster file. That is why the block
# below is commented out rather than populated with a worked example: a real value
# here would give every cluster the same scopeName and network, and they would all
# collide on the same Request object name.
#
# The whole template is gated on dhcp_values.scopeName, so a cluster with no DHCP
# block renders nothing at all — which is the correct outcome for one that does not
# need a scope.
#
# dhcp_values:
#   scopeName: "tomer-hc-workers"
#   network: "10.20.30.0"
#   startRange: "10.20.30.11"
#   endRange: "10.20.30.240"
#   leaseDurationDays: 8
#   description: "DHCP scope for tomer hosted cluster"
#
#   # subnetMask and gateway are the only two derived fields:
#   #   subnetMask -> 255.255.255.0
#   #   gateway    -> the subnet's .254 address (10.20.30.254)
#   # Omitting the key derives it; writing null or "" is honoured as written.
#   subnetMask: "255.255.0.0"  # any non-/24 mask REQUIRES an explicit gateway
#   gateway: "10.20.30.1"      # a gateway that is not the .254 default
#   gateway: ""                # no router option at all (DHCP option 3 unset)
#
#   dns:
#     # IMPORTANT: DNS server order is preserved exactly as written.
#     # First entry = primary DNS, second = secondary. The API does NOT sort them.
#     # Windows DHCP returns servers in the order they were set, so this order must
#     # match what the DHCP server has stored — otherwise Crossplane will PUT every 60 seconds.
#     servers:
#       - "10.50.1.5"
#       - "10.50.1.6"
#     domain: "tomer.lab.local"
#
#   # PXE boot options — DHCP option 66 (boot server) and option 67 (boot file).
#   #
#   # Optional, but BOTH-OR-NOTHING: setting one without the other is a hard error in
#   # both the CI validator and the API, because a host that gets a boot server with no
#   # boot file (or the reverse) silently fails to network-boot. Omitting the whole
#   # block leaves options 66/67 unset on the server.
#   #
#   # Note per-architecture boot files (BIOS vs UEFI) are NOT expressible here — that
#   # needs Windows DHCP policies matching option 93, which this API does not manage.
#   pxe:
#     server: "10.50.1.20"      # host name or IP of the TFTP/HTTP boot server
#     bootfile: "snponly.efi"   # or a full URL for iPXE HTTP chainloading
#
#   # IMPORTANT: exclusions MUST be listed in ascending IP numerical order.
#   # The API always returns exclusions sorted by IP. If values file order differs from
#   # IP numerical order, Crossplane will detect a mismatch on every GET and issue a PUT
#   # every 60 seconds indefinitely (reconciliation loop).
#   # Correct:   10.20.30.1 → 10.20.30.10, then 10.20.30.241 → 10.20.30.254
#   # Incorrect: 10.20.30.241 first — would cause a PUT loop.
#   exclusions:
#     - startAddress: "10.20.30.1"
#       endAddress: "10.20.30.10"
#     - startAddress: "10.20.30.241"
#       endAddress: "10.20.30.254"
#
#   # failover: null removes an inherited relationship. failover: {} does NOT —
#   # Helm deep-merges an empty map, leaving the parent's values in place.
#   failover:
#     partnerServer: "dhcp02.lab.local"
#     relationshipName: "tomer-hc-failover"
#     mode: "HotStandby"
#     serverRole: "Active"        # Active on this server, Standby on partner
#     reservePercent: 5           # % of IPs reserved for standby server
#     maxClientLeadTimeMinutes: 60
#
#   failover:
#     partnerServer: "dhcp02.lab.local"
#     relationshipName: "tomer-hc-failover"
#     mode: "LoadBalance"
#     loadBalancePercent: 50      # % handled by THIS server
#     maxClientLeadTimeMinutes: 60
