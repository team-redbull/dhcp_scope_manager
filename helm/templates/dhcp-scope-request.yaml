{{- if and .Values.dhcp_values .Values.dhcp_values.scopeName }}
apiVersion: http.crossplane.io/v1alpha2
kind: Request
metadata:
  name: dhcp-scope-{{ required "dhcp_values.network is required" .Values.dhcp_values.network | replace "." "-" }}
  namespace: {{ .Values.crossplane.namespace | default "crossplane-system" }}
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: {{ .Values.crossplane.providerConfigName | default "dhcp-http" }}
  forProvider:
    headers:
      Content-Type:
        - "application/json"
      Accept:
        - "application/json"
      {{- with .Values.dhcp_api.tokenSecretRef }}
      {{- if and .name .namespace .key }}
      # provider-http resolves {{ "{{" }} name:namespace:key {{ "}}" }} against a live Secret at
      # reconcile time and sends the resolved value, while storing only the
      # placeholder in spec, status.requestDetails and its own logs — so the token
      # never lands in git or in the Argo CD UI. Placeholders work in headers and
      # body only. NOT secretInjectionConfigs: that runs the other direction,
      # extracting response fields *into* a Secret.
      Authorization:
        - {{ printf "Bearer {{ %s:%s:%s }}" .name .namespace .key | quote }}
      {{- end }}
      {{- end }}

    payload:
      # The scope address is the resource identifier, so it lives in the URL only —
      # it is deliberately absent from the body. Baked in here at template time
      # because dhcp_values.network is already required for the object name above.
      baseUrl: "{{ required "dhcp_api.url is required" .Values.dhcp_api.url }}/api/v1/scopes/{{ required "dhcp_values.network is required" .Values.dhcp_values.network }}"
      # A JSON *string*, not a mapping — provider-http types this field as a string
      # and the API server rejects anything else. The mappings below parse it with jq.
      body: |
        {{- include "dhcp.payload" . | nindent 8 }}

    mappings:
      - method: "POST"
        url: (.payload.baseUrl)
        body: .payload.body

      - method: "GET"
        url: (.payload.baseUrl)

      - method: "PUT"
        url: (.payload.baseUrl)
        body: .payload.body

      - method: "DELETE"
        url: (.payload.baseUrl)
{{- end }}