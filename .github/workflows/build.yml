name: Build and Push

on:
  push:
    branches: [ '**' ]
  delete:

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.event_name == 'push'
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: dhcp-scope-manager
      # Argo CD service: the chart lives in its own repo, so the image bump and
      # the vX.Y.Z tag land there rather than here.
      chart-repo: team-redbull/helm-charts-dhcp-scope-manager
      helm-values-path: values.yaml
    secrets: inherit

  cleanup-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: dhcp-scope-manager
    secrets: inherit
