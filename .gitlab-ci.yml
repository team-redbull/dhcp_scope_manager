stages:
  - validate
  - test

# ─── DHCP Values Structure & Content Validation ───────────────────────────────
#
# Validates only the clusters affected by the current MR diff.
# Inheritance-aware: a change to sites/<site>/values.yaml re-validates
# every cluster under that site; a single hostedClusters/*.yaml change
# validates only that cluster.
#
# Runs on MR when any sites/**/*.yaml file changes.
validate_dhcp_values:
  stage: validate
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r scripts/requirements.txt
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  script:
    - >
      python3 scripts/validate_changed_clusters.py
      --base-ref origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      --sites-dir sites
      --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - sites/**/*.yaml

# ─── Unit Tests ───────────────────────────────────────────────────────────────
#
# Runs the full pytest suite (existing tests + new validate_dhcp_values tests).
# Triggers on MR when Python source, scripts, or tests change.
unit_tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet -r requirements.txt -r scripts/requirements.txt
  script:
    - pytest tests/ -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - app/**/*.py
        - scripts/**/*.py
        - tests/**/*.py
        - requirements.txt
        - scripts/requirements.txt
